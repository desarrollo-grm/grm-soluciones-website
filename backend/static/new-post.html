<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo artículo en GRM-soluciones</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #333333;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .header {
            background-color: #0f2c59; /* Color corporativo principal */
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .content {
            padding: 40px 30px;
        }
        .tag {
            display: inline-block;
            background-color: #e1e7ff;
            color: #4051b5;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .post-title {
            font-size: 22px;
            color: #0f2c59;
            margin-top: 0;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        .post-excerpt {
            font-size: 16px;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .button-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #ff6b6b; /* Color de acento para el botón */
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            transition: background-color 0.3s ease;
        }
        .footer {
            background-color: #f4f6f9;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #888888;
            border-top: 1px solid #e9ecef;
        }
        .footer a {
            color: #0f2c59;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f6f9; padding: 20px 0;">
        <tr>
            <td>
                <div class="email-container">
                    
                    <!-- ENCABEZADO -->
                    <div class="header">
                        <h1>GRM-soluciones</h1>
                    </div>

                    <!-- CONTENIDO PRINCIPAL -->
                    <div class="content">
                        <!-- Tag dinámica (Soporte) -->
                        <span class="tag">{{tags[0]}}</span>
                        
                        <!-- Título del Post -->
                        <h2 class="post-title">{{title}}</h2>
                        
                        <!-- Extracto/Descripción -->
                        <p class="post-excerpt">
                            {{excerpt}}
                        </p>
                        
                        <!-- Botón de Acción usando el url -->
                        <div class="button-container">
                            <a href="{{post-url}}" class="btn" target="_blank">Leer artículo completo</a>
                        </div>
                    </div>

                    <!-- PIE DE PÁGINA -->
                    <div class="footer">
                        <p>© 2026 GRM-soluciones. Todos los derechos reservados.</p>
                        <p>Recibiste este correo porque estás suscrito a nuestra newsletter.</p>
                        <p><a href="{{unsubscribe_url}}">Darme de baja</a> | <a href="#">Política de privacidad</a></p>
                    </div>

                </div>
            </td>
        </tr>
    </table>

</body>
</html>
