<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo mensaje de contacto</title>
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #f4f6f9;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #333333;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .header {
            padding: 30px 20px;
            background-color: #0f2c59;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .content {
            padding: 36px 30px;
        }
        .tag {
            display: inline-block;
            margin-bottom: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            background-color: #e1e7ff;
            color: #4051b5;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .intro {
            margin: 0 0 24px;
            color: #555555;
            font-size: 16px;
            line-height: 1.6;
        }
        .details {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }
        .details th,
        .details td {
            padding: 12px 0;
            border-bottom: 1px solid #e9ecef;
            text-align: left;
            vertical-align: top;
            line-height: 1.5;
        }
        .details th {
            width: 34%;
            color: #0f2c59;
            font-size: 13px;
        }
        .details td {
            color: #555555;
            font-size: 15px;
            overflow-wrap: anywhere;
        }
        .message {
            margin: 0;
            padding: 18px;
            border-left: 4px solid #ff6b6b;
            background-color: #fff7f7;
            color: #444444;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .footer {
            padding: 20px;
            border-top: 1px solid #e9ecef;
            background-color: #f4f6f9;
            color: #888888;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td>
                <div class="email-container">
                    <div class="header">
                        <h1>GRM-soluciones</h1>
                    </div>

                    <div class="content">
                        <span class="tag">Contacto web</span>
                        <p class="intro">Se recibió un nuevo mensaje desde el formulario de contacto.</p>

                        <table class="details">
                            <tr>
                                <th>Nombre</th>
                                <td>{{name}}</td>
                            </tr>
                            <tr>
                                <th>Correo electrónico</th>
                                <td>{{email}}</td>
                            </tr>
                            <tr>
                                <th>Teléfono</th>
                                <td>{{telephone}}</td>
                            </tr>
                            <tr>
                                <th>Fecha y hora</th>
                                <td>{{timestamp}}</td>
                            </tr>
                        </table>

                        <h2 style="margin: 0 0 10px; color: #0f2c59; font-size: 18px;">Mensaje</h2>
                        <p class="message">{{message}}</p>
                    </div>

                    <div class="footer">
                        <p style="margin: 0;">Notificación automática del formulario de contacto de GRM-soluciones.</p>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
